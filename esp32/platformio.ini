; PLG_TFT_LCD_TASKMANAGER — ESP32 Edition
; Xem README_ESP32_MIGRATION.md ở thư mục gốc để biết kế hoạch đầy đủ.

[env:esp32dev]
; Ghim phien ban platform thay vi de trong: de trong se keo ve ban moi nhat, khien build co
; the doi hanh vi giua cac may/thoi diem. 6.9.0 = Arduino-ESP32 core 2.0.17, ban on dinh lau
; nam, da du WiFi/BLE/Preferences cho toan bo backlog migration.
platform = espressif32@6.9.0
; ESP32 co dien (ESP32-D0WD-V3, 4MB flash, cau USB-UART CH340) - KHONG phai ESP32-S3.
; Tai lieu migration ban dau nham toi S3; phan cung thuc te la ban nay, xem muc "Khac biet
; so voi ban Pico" trong README.md canh ben de biet nhung gi phai doi theo.
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Khong co co USB CDC nao o day: ESP32 co dien khong co USB native, Serial di thang ra UART0
; (GPIO1/3) roi qua chip CH340 tren board. Cac co ARDUINO_USB_* chi danh cho dong S2/S3/C3.
build_flags =
	-Iinclude

; NimBLE thay cho thu vien BLE (Bluedroid) co san trong framework: cung chuc nang nhung ton
; it flash/RAM hon han - dang ke vi firmware nay co ca WiFi lan BLE, ma board chi co 4MB flash.
lib_deps = h2zero/NimBLE-Arduino@^1.4.2
