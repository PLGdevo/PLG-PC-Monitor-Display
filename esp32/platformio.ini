; PLG_TFT_LCD_TASKMANAGER — ESP32-S3 Edition
; Sprint 0.1: khung dự án PlatformIO cho board esp32-s3-devkitc-1.
; Xem README_ESP32_MIGRATION.md ở thư mục gốc để biết kế hoạch đầy đủ.

[env:esp32-s3-devkitc-1]
; Ghim phien ban platform thay vi de trong: de trong se keo ve ban moi nhat, khien build co
; the doi hanh vi giua cac may/thoi diem. 6.9.0 = Arduino-ESP32 core 2.0.17, ban on dinh lau
; nam, da du WiFi/BLE/Preferences cho toan bo backlog migration.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Board dùng USB OTG native (CDC) để nạp firmware + debug Serial qua cổng USB-C.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
